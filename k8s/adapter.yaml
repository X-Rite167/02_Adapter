apiVersion: v1
kind: Namespace
metadata:
  name: litellm
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: confidential-adapter
  namespace: litellm
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: confidential-adapter-config
  namespace: litellm
data:
  # Replace these values for the target Alibaba Cloud MaaS workspace.
  CMAAS_ENDPOINT: "https://<WORKSPACE_ID>.cn-beijing.maas.aliyuncs.com/api/v1/services"
  CMAAS_MODEL: "cmaas-deepseek-v4-flash-0731"
---
apiVersion: v1
kind: Secret
metadata:
  name: confidential-adapter-secret
  namespace: litellm
type: Opaque
stringData:
  # Replace before applying, or manage this Secret with an external-secrets operator.
  DASHSCOPE_API_KEY: "REPLACE_ME"
---
apiVersion: v1
kind: Service
metadata:
  name: confidential-adapter
  namespace: litellm
  labels:
    app: confidential-adapter
spec:
  type: ClusterIP
  selector:
    app: confidential-adapter
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: confidential-adapter
  namespace: litellm
  labels:
    app: confidential-adapter
spec:
  serviceName: confidential-adapter
  replicas: 1
  selector:
    matchLabels:
      app: confidential-adapter
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: confidential-adapter
    spec:
      serviceAccountName: confidential-adapter
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: adapter
          # Replace with the immutable image reference built from Dockerfile.
          image: REPLACE_WITH_REGISTRY/confidential-adapter:REPLACE_WITH_TAG
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          args:
            - --endpoint=$(CMAAS_ENDPOINT)
            - --model=$(CMAAS_MODEL)
            - --listen=0.0.0.0:8080
            - --workers=2
            - --max-concurrency=4
            - --transparency-report-dir=/var/lib/cmaas/reports
            - --no-prompt-in-transparency-report
          env:
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: confidential-adapter-secret
                  key: DASHSCOPE_API_KEY
            - name: CMAAS_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: confidential-adapter-config
                  key: CMAAS_ENDPOINT
            - name: CMAAS_MODEL
              valueFrom:
                configMapKeyRef:
                  name: confidential-adapter-config
                  key: CMAAS_MODEL
            - name: CMAAS_ALLOW_ATTESTATION_FALLBACK
              value: "false"
            - name: CMAAS_DEBUG
              value: "false"
          volumeMounts:
            - name: reports
              mountPath: /var/lib/cmaas/reports
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /v1/models
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: reports
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: confidential-adapter
  namespace: litellm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: confidential-adapter
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: confidential-adapter
  namespace: litellm
spec:
  podSelector:
    matchLabels:
      app: confidential-adapter
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: litellm
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 443
