apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - adapter.yaml

# Override the placeholder image without editing the base manifest:
# kustomize edit set image adapter=registry.example.com/team/confidential-adapter@sha256:<digest>
images:
  - name: REPLACE_WITH_REGISTRY/confidential-adapter
    newName: registry.example.com/team/confidential-adapter
    newTag: "0.1.0"
